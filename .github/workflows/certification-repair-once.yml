name: One-time MNIST hosted certification source formatting
on:
  push:
    branches:
      - certification/hosted-gates-20261112

permissions:
  contents: write

jobs:
  prepare-repair:
    if: github.repository == 'ryanrowe2/mnist-logistic-optimization'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact Ruff version from hosted certification
        run: python -m pip install ruff==0.17.5
      - name: Apply proven lint autofixes and canonical formatting
        run: |
          ruff check --fix .
          ruff format .
          ruff check .
          ruff format --check .
      - name: Regenerate manifest and verify portable release
        run: |
          python scripts/build_release.py --output /tmp/mnist-certification-repair.zip
          python scripts/verify_release.py /tmp/mnist-certification-repair.zip
      - name: Commit only repaired tracked source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Refresh certified v1.15.1 manifest and formatting"
            git push origin HEAD:refs/heads/certification/hosted-gates-20261112
          fi
