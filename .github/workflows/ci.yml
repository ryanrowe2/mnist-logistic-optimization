name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_mnist_smoke:
        description: "Download real OpenML MNIST and run a small end-to-end smoke test"
        type: boolean
        default: false
      run_full_mnist:
        description: "Execute full 10k historical and 2k official-split runs against real OpenML MNIST"
        type: boolean
        default: false
      generate_reference_lock:
        description: "Acquire platform wheels, generate a SHA-256 hash lock, and verify offline installation"
        type: boolean
        default: false

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  MPLBACKEND: "Agg"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and QA requirements
        run: python -m pip install -e '.[dev]'
      - name: Ruff static analysis
        run: ruff check .
      - name: Tests and coverage (offline and deterministic)
        run: python -m pytest -p pytest_cov -m 'not network' --cov=mnist_optimization --cov=scripts --cov-report=term-missing --cov-fail-under=80
      - name: Build and verify portable repository release ZIP
        run: |
          python scripts/build_release.py --output /tmp/mnist-logistic-release.zip
          python scripts/verify_release.py /tmp/mnist-logistic-release.zip
      - name: Build distribution wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Install built wheel and run installed CLI
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import mnist_optimization, mnist_optimization.tuning, mnist_optimization.provenance"
          mnist-optimize --help
          python scripts/reproduce_original.py --help
          python scripts/run_experiments.py --help
          python scripts/compare_optimizers.py --help
          python scripts/tune_optimizers.py --help

  openml-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mnist_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Live source and end-to-end evaluation smoke (no fixture substitution)
        env:
          MNIST_LIVE_TEST: '1'
        run: python -m pytest -m network -q -s

  full-real-mnist:
    if: github.event_name == 'workflow_dispatch' && inputs.run_full_mnist
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install reproducible experiment dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run BOTH full-length experiments on real OpenML MNIST
        run: python scripts/verify_real_mnist.py --output-root real_mnist_validation
      - name: Upload original observed results and full-dataset fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-mnist-full-validation
          path: real_mnist_validation/
          if-no-files-found: warn
          retention-days: 30

  hashed-reference-lock:
    if: github.event_name == 'workflow_dispatch' && inputs.generate_reference_lock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Acquire matching Linux/Python 3.13 wheels
        run: |
          python -m pip download --only-binary=:all: -d wheelhouse \
            -r requirements-validation.txt 'ruff>=0.8,<1' wheel packaging 'setuptools>=68' 
      - name: Install wheel metadata validator
        run: python -m pip install 'packaging>=23,<27'
      - name: Generate pinned wheel SHA-256 lock
        run: python scripts/create_platform_lock.py --wheelhouse wheelhouse --output locks/reference-py313-linux-hashed.txt
      - name: Verify installation using the hash lock and ONLY acquired wheels
        run: python -m pip install --no-index --find-links wheelhouse --require-hashes --target /tmp/locked-install -r locks/reference-py313-linux-hashed.txt
      - name: Smoke-test locked third-party packages in isolated target
        env:
          PYTHONPATH: /tmp/locked-install
        run: |
          cd /tmp
          python -c "import numpy, matplotlib, sklearn, pytest, packaging, ruff; print('Verified locked imports')"
      - uses: actions/upload-artifact@v4
        with:
          name: reference-py313-linux-hash-lock
          path: locks/reference-py313-linux-hashed.txt
          if-no-files-found: error
