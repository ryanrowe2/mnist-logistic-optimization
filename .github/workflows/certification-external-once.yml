name: One-time MNIST external certification
on:
  push:
    branches:
      - certification/hosted-gates-20261112

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  MPLBACKEND: "Agg"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

permissions:
  contents: read

jobs:
  openml-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Live source and end-to-end evaluation smoke (no fixture substitution)
        env:
          MNIST_LIVE_TEST: '1'
        run: python -m pytest -m network -q -s

  full-real-mnist:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install reproducible experiment dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run BOTH full-length experiments on real OpenML MNIST
        run: python scripts/verify_real_mnist.py --output-root real_mnist_validation
      - name: Upload original observed results and full-dataset fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-mnist-full-validation
          path: real_mnist_validation/
          if-no-files-found: warn
          retention-days: 30

  hashed-reference-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Acquire matching Linux/Python 3.13 wheels
        run: |
          python -m pip download --only-binary=:all: -d wheelhouse \
            -r requirements-validation.txt 'ruff>=0.8,<1' wheel packaging 'setuptools>=68' 
      - name: Install wheel metadata validator
        run: python -m pip install 'packaging>=23,<27'
      - name: Generate pinned wheel SHA-256 lock
        run: python scripts/create_platform_lock.py --wheelhouse wheelhouse --output locks/reference-py313-linux-hashed.txt
      - name: Verify installation using the hash lock and ONLY acquired wheels
        run: python -m pip install --no-index --find-links wheelhouse --require-hashes --target /tmp/locked-install -r locks/reference-py313-linux-hashed.txt
      - name: Smoke-test locked third-party packages in isolated target
        env:
          PYTHONPATH: /tmp/locked-install
        run: |
          cd /tmp
          python -c "import numpy, matplotlib, sklearn, pytest, packaging, ruff; print('Verified locked imports')"
      - uses: actions/upload-artifact@v4
        with:
          name: reference-py313-linux-hash-lock
          path: locks/reference-py313-linux-hashed.txt
          if-no-files-found: error
