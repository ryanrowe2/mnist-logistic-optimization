[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnist-logistic-optimization"
version = "1.15.1"
description = "Reconstructed NumPy logistic regression and rigorously validated numerical optimization experiments on MNIST."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ryan Rowe"}]
dependencies = [
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
mnist = ["scikit-learn>=1.4,<2", "pandas>=2.2,<4", "packaging>=23,<27"]
dev = ["pandas>=2.2,<4", "pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1", "scikit-learn>=1.4,<2", "packaging>=23,<27"]

[project.scripts]
mnist-optimize = "mnist_optimization.experiments:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["network: opt-in live MNIST experiment requiring the real OpenML dataset"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
